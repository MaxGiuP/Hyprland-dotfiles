# Quickshell's hashed render/download caches should survive QML reloads but
# need not grow forever. The user tmpfiles cleaner prunes cold entries daily.
e %h/.cache/quickshell/media/coverart - - - 30d -
e %h/.cache/quickshell/media/favicons - - - 30d -
e %h/.cache/quickshell/media/latex - - - 14d -
e /tmp/quickshell/media/images - - - 1d -
e /tmp/quickshell/media/cliphist - - - 1d -
