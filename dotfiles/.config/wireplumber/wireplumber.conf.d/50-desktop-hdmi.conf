# Both connected NVIDIA HDMI endpoints are stereo. Let ACP read their ELD
# channel data instead of exposing eight unusable Pro Audio channels.
wireplumber.settings = {
    monitor.alsa.autodetect-hdmi-channels = true
}

# Pro Audio is required to expose both monitor outputs at the same time.
monitor.alsa.rules = [
    {
        matches = [
            {
                device.name = "alsa_card.pci-0000_01_00.1"
            }
        ]
        actions = {
            update-props = {
                device.profile = "pro-audio"
            }
        }
    }
]
