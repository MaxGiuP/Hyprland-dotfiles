# Native combined output for the two desktop-monitor HDMI sinks.
# combine-stream watches these exact nodes and reconnects them after hotplug,
# resume, or an audio-service restart.
context.modules = [
    {
        name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "CombinedStereo"
            node.description = "Combined Sound"
            combine.latency-compensate = true

            combine.props = {
                audio.position = [ FL FR ]
            }

            stream.props = {
                stream.dont-remix = true
            }

            stream.rules = [
                {
                    matches = [
                        {
                            media.class = "Audio/Sink"
                            node.name = "alsa_output.pci-0000_01_00.1.pro-output-7"
                        }
                    ]
                    actions = {
                        create-stream = {
                            combine.audio.position = [ FL FR ]
                            audio.position = [ FL FR ]
                        }
                    }
                }
                {
                    matches = [
                        {
                            media.class = "Audio/Sink"
                            node.name = "alsa_output.pci-0000_01_00.1.pro-output-3"
                        }
                    ]
                    actions = {
                        create-stream = {
                            combine.audio.position = [ FL FR ]
                            audio.position = [ FL FR ]
                        }
                    }
                }
            ]
        }
    }
]
