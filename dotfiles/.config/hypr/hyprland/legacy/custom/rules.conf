# QSUpdate (kitty)
windowrule = match:class ^(kitty)$, match:title ^(QSUpdate)$, float on, size 1000 750, center on
#windowrule = match:class ^(kitty)$, opacity 0.96

# KDE portal dialog
windowrule = match:class ^(org\.freedesktop\.impl\.portal\.desktop\.kde)$, float on, size 1000 725, center on

# Nautilus/Files: keep fully opaque and disable blur bleed-through
windowrule = match:class ^(org\.gnome\.Nautilus|nautilus|Nautilus)$, opacity 1
windowrule = match:class ^(org\.gnome\.Nautilus|nautilus|Nautilus)$, no_blur on
windowrule = match:title ^(Files|Nautilus).*$, opacity 1
windowrule = match:title ^(Files|Nautilus).*$, no_blur on

# Fallback: some GNOME apps report different class names under Wayland
windowrule = match:class ^(org\.gnome\..*)$, opacity 1
windowrule = match:class ^(org\.gnome\..*)$, no_blur on

# Chromium/Brave: keep browser popups square and shadowless.
windowrule = match:class ^(Brave-browser|brave-browser|Google-chrome|google-chrome|Chromium|chromium|chromium-browser)$, match:float 1, no_shadow on
windowrule = match:class ^(Brave-browser|brave-browser|Google-chrome|google-chrome|Chromium|chromium|chromium-browser)$, match:float 1, rounding 0

# Chromium menu shells can arrive as anonymous floating windows with empty
# class/title. Strip compositor decoration from those too.
windowrule = match:class ^$, match:title ^$, match:float 1, no_shadow on
windowrule = match:class ^$, match:title ^$, match:float 1, rounding 0
windowrule = match:class ^$, match:title ^$, match:float 1, no_blur on
