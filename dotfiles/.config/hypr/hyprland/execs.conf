# Bar, wallpaper
exec-once = ~/.config/hypr/hyprland/scripts/__restore_video_wallpaper.sh
exec-once = python3 ~/.config/quickshell/$qsConfig/scripts/colors/apply_gnome_accent.py

# Core components (authentication, lock screen, notification daemon)
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/pam_kwallet_init
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE DBUS_SESSION_BUS_ADDRESS HYPRCURSOR_THEME HYPRCURSOR_SIZE
exec-once = ~/.config/hypr/hyprland/scripts/quickshell_restart_from_hyprland.sh $qsConfig
# The bridge activates kdeconnectd through D-Bus; keep all companion daemons
# under the user service manager instead of launching a duplicate directly.
exec-once = systemctl --user start kdeconnect-bridge.service tv-mode-daemon.service kdeconnect-cursor-sync.service
exec-once = sleep 8 && kdeconnect-sms

# Audio
exec-once = easyeffects --hide-window --service-mode
exec = sh -c "~/.config/hypr/hyprland/scripts/combine_audio.sh"
exec-once = systemctl --user start input-remapper.service

# Clipboard: history
# exec-once = wl-paste --watch cliphist store &
exec-once = wl-paste --type text --watch bash -c 'cliphist store && qs -c $qsConfig ipc call cliphistService update'
exec-once = wl-paste --type image --watch bash -c 'cliphist store && qs -c $qsConfig ipc call cliphistService update'

# Cursor
exec-once = hyprctl setcursor Adwaita 32

# Monitor and XWayland follow-up
exec-once = ~/.config/hypr/hyprland/scripts/focus_primary_monitor.sh
exec-once = ~/.config/hypr/hyprland/scripts/set_primary_xwayland_monitor.sh

# Fix dock pinned apps not launching properly (https://github.com/end-4/dots-hyprland/issues/2200)
# This causes https://github.com/end-4/dots-hyprland/issues/2427
# exec-once = sleep 3.5 && hyprctl reload && sleep 0.5 && touch ~/.config/quickshell/ii/shell.qml
