[package]
name = "linmax-desktop-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
evdev = "0.13.2"
libc = "0.2"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = "0.13.2"
zbus = "5.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "kdeconnect-bridge"
path = "src/bin/kdeconnect_bridge.rs"

[[bin]]
name = "kdeconnect-cursor-sync"
path = "src/bin/kdeconnect_cursor_sync.rs"

[[bin]]
name = "tv-mode-daemon"
path = "src/bin/tv_mode_daemon.rs"
