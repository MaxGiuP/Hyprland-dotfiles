$lock_cmd = ~/.config/hypr/hyprland/scripts/lock_with_quickshell.sh ii
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = ~/.config/hypr/hyprland/scripts/on-resume.sh
    inhibit_sleep = 3
}

# The complete idle schedule is generated from Quickshell below.

# >>> quickshell managed idle lock >>>
# Lock first. Normal idle inhibitors, including coffee mode and media,
# intentionally pause this step.
listener {
    timeout = 1200
    on-timeout = $lock_cmd
}

# Once locked, power down the displays even if an application still owns
# a stale idle inhibitor. The condition explicitly honors coffee mode.
listener {
    timeout = 1260
    on-timeout = ~/.config/hypr/hyprland/scripts/hypr_dispatch.sh dpms off
    on-resume = ~/.config/hypr/hyprland/scripts/on-dpms-resume.sh
    ignore_inhibit = true
    condition_cmd = ~/.config/hypr/hyprland/scripts/quickshell_locked_idle_action_allowed.sh ii
    condition_retry = 15
}

# Suspend only after a real Wayland session lock is active and coffee mode
# is off. Hypridle also holds external sleep requests until the lock lands.
listener {
    timeout = 2700
    on-timeout = $suspend_cmd
    ignore_inhibit = true
    condition_cmd = ~/.config/hypr/hyprland/scripts/quickshell_locked_idle_action_allowed.sh ii
    condition_retry = 30
}
# <<< quickshell managed idle lock <<<
